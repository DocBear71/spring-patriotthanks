name: Build, Test, and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Run unit tests (Extra Credit)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Run unit tests (H2 in-memory, no MySQL needed)
      - name: Run unit tests
        run: ./gradlew test -x jar

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build JAR, push Docker image, update Azure (Extra Credit)
  # Only runs if tests pass
  # ─────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: test  # Wait for tests to pass first

    steps:
      # 1. Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build the JAR file with Gradle
      - name: Build with Gradle
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
        run: ./gradlew clean bootJar -x test -x jar

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spring-patriotthanks:latest
