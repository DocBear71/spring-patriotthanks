# =====================================================================
# Bluehost MySQL Profile
# Extra credit: migrated from Google Cloud MySQL to Bluehost MySQL
# Database: bodrtrte_patriotthanks
# =====================================================================

database=mysql

# Connection ? credentials injected via Azure Container App environment variables
# MYSQL_URL  = jdbc:mysql://box5152.bluehost.com:3306/bodrtrte_patriotthanks?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# MYSQL_USER = bodrtrte_DocBear4204
# MYSQL_PASS = (set in Azure, never committed to source control)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASS}

# Run schema and data scripts on startup (scripts are idempotent ? safe to re-run)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/mysql/schema.sql
spring.sql.init.data-locations=classpath:db/mysql/data.sql

# JPA / Hibernate ? let the SQL scripts manage the schema
spring.jpa.hibernate.ddl-auto=none

# HikariCP connection pool ? tuned for shared hosting
# Bluehost shared hosting has a low max_connections limit (~25 per account)
# Keep pool small to avoid exhausting the server's connection limit
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# Retire connections well before MySQL's default wait_timeout (28800s = 8h)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
# Validate connections before use to catch stale ones from the pool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=20000

# =====================================================================
# Cloudflare Turnstile CAPTCHA Configuration
# =====================================================================
turnstile.site-key=${TURNSTILE_SITE_KEY:1x00000000000000000000AA}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}

# =====================================================================


# Temporary SQL logging to diagnose empty business list on MySQL 5.7
logging.level.org.hibernate.SQL=DEBUG
