<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{patriot/patriotLayout :: patriotLayout (~{::body},'businesses')}">

<body>

<h2 th:text="${business.id == null} ? #{addBusiness} : #{editBusiness}">Add Business</h2>

<form th:object="${business}" class="form-horizontal" id="add-business-form" method="post"
      th:action="${business.id == null} ? @{/businesses/new} : @{|/businesses/${business.id}/edit|}">

  <input th:replace="~{fragments/inputField :: input ( #{label.business.name}, 'name', 'text')}" />

  <div class="mb-3">
    <label class="form-label" th:text="#{label.business.type}">Business Type</label>
    <div class="position-relative">
      <select th:field="*{businessType}"
              th:class="${#fields.hasErrors('businessType')} ? 'form-select is-invalid' : 'form-select'">
        <option value="" th:text="#{business.type.select}">-- Select a Type --</option>
        <option th:each="type : ${types}"
                th:value="${type.id}"
                th:text="${type.name}">Type</option>
      </select>

      <span th:if="${#fields.hasErrors('businessType')}"
            class="fa fa-remove position-absolute text-danger"
            style="top: 10px; right: 10px;"
            aria-hidden="true"></span>

      <div th:if="${#fields.hasErrors('businessType')}" class="invalid-feedback" style="display:block">
        <span th:errors="*{businessType}">Error Message</span>
      </div>
    </div>
  </div>

  <input th:replace="~{fragments/inputField :: input (#{label.business.website}, 'website', 'text')}" />

  <div class="mb-3">
    <label for="description" class="form-label" th:text="#{label.business.description}">Description</label>
    <div class="position-relative">
      <textarea id="description"
                th:field="*{description}"
                th:class="${#fields.hasErrors('description')} ? 'form-control is-invalid' : 'form-control'"
                rows="3"></textarea>

      <span th:if="${#fields.hasErrors('description')}"
            class="fa fa-remove position-absolute text-danger"
            style="top: 10px; right: 10px;"
            aria-hidden="true"></span>

      <div th:if="${#fields.hasErrors('description')}" class="invalid-feedback" style="display:block">
        <span th:errors="*{description}">Error Message</span>
      </div>
    </div>
  </div>

  <!--
    Active/Inactive toggle: only shown when editing an existing business
    and only visible to users with MANAGE_BUSINESSES permission.
    New businesses always start active by default (Business.java default = true).
  -->
  <div class="mb-3"
       th:if="${business.id != null}"
       sec:authorize="hasAuthority('MANAGE_BUSINESSES')">
    <label class="form-label" th:text="#{label.business.status}">Business Status</label>
    <div class="form-check form-switch">
      <input class="form-check-input"
             type="checkbox"
             id="isActive"
             th:field="*{isActive}"
             role="switch" />
      <label class="form-check-label" for="isActive">
        <span th:if="${business.isActive}" class="text-success fw-semibold"
              th:text="#{business.status.active}">Active</span>
        <span th:unless="${business.isActive}" class="text-danger fw-semibold"
              th:text="#{business.status.inactive}">Inactive</span>
      </label>
    </div>
    <div class="form-text text-muted" th:text="#{business.status.help}">
      Inactive businesses are hidden from the public listings.
    </div>
  </div>

  <div class="form-group">
    <div class="col-sm-offset-2 col-sm-10">
      <button class="btn btn-primary" type="submit"
              th:text="${business.id == null} ? #{addBusiness} : #{editBusiness}">Add Business</button>
    </div>
  </div>

</form>

</body>
</html>
