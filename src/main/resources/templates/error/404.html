<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'error')}">
<body>
<div class="container mt-5">

  <!-- Top rule -->
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="text-center mb-4">
        <span style="display:inline-block; width:60px; height:4px; background:#b22234;"></span>
        <span style="display:inline-block; width:20px; height:4px; background:#3c3b6e; margin:0 4px;"></span>
        <span style="display:inline-block; width:60px; height:4px; background:#b22234;"></span>
      </div>

      <!-- Main error card -->
      <div class="card border-0 shadow-lg">
        <div class="card-header text-white text-center py-4"
             style="background: linear-gradient(135deg, #3c3b6e 0%, #1a1a4e 100%);">
          <div style="font-size:5rem; font-weight:900; letter-spacing:8px; line-height:1;">404</div>
          <div style="font-size:0.85rem; letter-spacing:4px; text-transform:uppercase; opacity:0.8; margin-top:4px;">
            Mission Not Found
          </div>
        </div>

        <div class="card-body text-center py-5 px-4" style="background:#f8f9fa;">

          <!-- Star decoration -->
          <div style="color:#3c3b6e; font-size:1.5rem; margin-bottom:1rem;">
            &#9733; &nbsp; &#9733; &nbsp; &#9733;
          </div>

          <h2 class="mb-3" style="color:#3c3b6e; font-weight:700;">Page Not Found</h2>

          <p class="lead mb-2" style="color:#555;">
            The page you're looking for has gone AWOL.
          </p>
          <p class="mb-4" style="color:#777; font-size:0.95rem;">
            It may have been relocated, decommissioned, or never existed.<br>
            Our team thanks you for your patience.
          </p>

          <!-- Divider -->
          <hr style="border-color:#dee2e6; width:60%; margin:1.5rem auto;">

          <!-- Action buttons -->
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-lg px-4"
               style="background:#3c3b6e; color:#fff; border:none;">
              <i class="fa fa-home me-2"></i> Return Home
            </a>
            <a th:href="@{/businesses}" class="btn btn-lg px-4"
               style="background:#b22234; color:#fff; border:none;">
              <i class="fa fa-search me-2"></i> Find Discounts
            </a>
          </div>
        </div>

        <div class="card-footer text-center py-3"
             style="background:#3c3b6e; color:rgba(255,255,255,0.7); font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;">
          Patriot Thanks &mdash; Honoring Those Who Serve
        </div>
      </div>

      <!-- Bottom rule -->
      <div class="text-center mt-4">
        <span style="display:inline-block; width:60px; height:4px; background:#b22234;"></span>
        <span style="display:inline-block; width:20px; height:4px; background:#3c3b6e; margin:0 4px;"></span>
        <span style="display:inline-block; width:60px; height:4px; background:#b22234;"></span>
      </div>

    </div>
  </div>

</div>
</body>
</html>
